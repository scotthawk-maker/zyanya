[package]
name = "zyanya-tui-wallet"
description = "Zyanya TUI Wallet for ZYAN, tokens, and DEX swaps"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zyanya-wallet"
path = "src/main.rs"

[dependencies]
zyanya-addresses.workspace = true
zyanya-consensus-core.workspace = true
zyanya-grpc-client.workspace = true
zyanya-hashes.workspace = true
zyanya-rpc-core.workspace = true
zyanya-txscript.workspace = true
zyanya-utils.workspace = true
zyanya-vm.workspace = true

secp256k1.workspace = true
rand.workspace = true
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
thiserror.workspace = true
dirs.workspace = true
faster-hex.workspace = true
crossterm = "0.27.0"
