    /* Subtle Cyber Dot Matrix */

      background-size: 32px 32px;
    }
    /* Ambient Core Glow */
    .core-glow {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, rgba(5, 7, 13, 0) 70%);
      pointer-events: none;
      z-index: 1;
      filter: blur(50px);
    }
    /* Soft Square Breathing Float */
    @keyframes softFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
        filter: drop-shadow(0 12px 35px rgba(56, 189, 248, 0.22));
      }
      50% {
        transform: translateY(-8px) scale(1.015);
        filter: drop-shadow(0 20px 50px rgba(56, 189, 248, 0.40));
      }
    }
    .floating-zyn {
      animation: softFloat 5s var(--ease-float) infinite;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .floating-zyn:hover {
      filter: drop-shadow(0 24px 60px rgba(56, 189, 248, 0.55));
    }
    .floating-zyn:active {
      transform: scale(0.95);
    }
    /* Custom Scrollbar for Drawer */

      height: 6px;

    }

      border-radius: 3px;

  <!-- Audio Haptic Engine -->
  <script>
    const AudioSynth = (() => {
      let ctx = null;
      return {
        ping: () => {
          try {
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;
            
            // Deep sub-bass pulse
            const sub = ctx.createOscillator();
            const subGain = ctx.createGain();
            sub.type = 'sine';
            sub.frequency.setValueAtTime(65.4, now); // C2
            sub.frequency.exponentialRampToValueAtTime(32.7, now + 0.35);
            subGain.gain.setValueAtTime(0.08, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            sub.connect(subGain);
            subGain.connect(ctx.destination);
            sub.start(now);
            sub.stop(now + 0.35);

            // Ethereal crystal chime
            const chime = ctx.createOscillator();
            const chimeGain = ctx.createGain();
            chime.type = 'sine';
            chime.frequency.setValueAtTime(1046.5, now); // C6
            chime.frequency.setValueAtTime(1318.5, now + 0.07); // E6
            chime.frequency.setValueAtTime(1567.98, now + 0.14); // G6
            chimeGain.gain.setValueAtTime(0.04, now);
            chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
            chime.connect(chimeGain);
            chimeGain.connect(ctx.destination);
            chime.start(now);
            chime.stop(now + 0.55);
          } catch(e) {}
        }
      };
    })();
  </script>

  <!-- Toast Notification -->

  <script>
    // Copy Canonical Socket
    function copySocket() {
      AudioSynth.ping();
      navigator.clipboard.writeText("[2606:8ac0:2615:79aa:5a47:caff:fe7b:d473]:18211");
      showToast("Canonical IPv6 Seed copied to clipboard");
    }

    function triggerEmblemPulse() {
      const ripple = document.getElementById("pulse-ripple");
      ripple.classList.remove("opacity-0");
      ripple.classList.add("opacity-100");
      setTimeout(() => {
        ripple.classList.remove("opacity-100");
        ripple.classList.add("opacity-0");
      }, 300);
      showToast("ZYN Sovereign Core Pinged");
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").textContent = msg;
      toast.classList.remove("translate-y-20", "opacity-0", "pointer-events-none");
      toast.classList.add("translate-y-0", "opacity-100");
      setTimeout(() => {
        toast.classList.remove("translate-y-0", "opacity-100");
        toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
      }, 2500);
    }



    // Client-side IPv6 reachability probe + Live Block fetch
    window.addEventListener("DOMContentLoaded", async () => {
      const dot = document.getElementById("ipv6-dot");
      const text = document.getElementById("ipv6-text");
      const blockStat = document.getElementById("live-block-stat");
      
      // 1. Fetch live DAG block height
      try {
        const dagRes = await fetch("/api/mcp/execute", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({name: "zyanya_get_dag_info", arguments: {}})
        });
        const dagData = await dagRes.json();
        if (dagData && dagData.daa_score) {
          blockStat.textContent = `DAA ${dagData.daa_score.toLocaleString()} • 1.0 BPS`;
        }
      } catch(e) {}

      // 2. Probe IPv6
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        const res = await fetch("https://api64.ipify.org?format=json", { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        const ip = data.ip || "";
        
        if (ip.includes(":")) {
          dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
          text.className = "text-emerald-300 font-semibold";
          text.textContent = "IPv6 Verified";
        } else {
          dot.className = "w-1.5 h-1.5 rounded-full bg-amber-400";
          text.className = "text-amber-300";
          text.textContent = "IPv4 Detected (Agent Bridge)";
        }
      } catch (e) {
        dot.className = "w-1.5 h-1.5 rounded-full bg-cyan";
        text.className = "text-cyan";
        text.textContent = "Agent Ready";
      }
    });
  </script>
