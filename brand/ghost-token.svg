<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ghostGradient" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#7EC8D3"/>
      <stop offset="50%" stop-color="#0D3B50"/>
      <stop offset="100%" stop-color="#0A0F1C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0A0F1C"/>
  <!-- Ghost outline with dashed red -->
  <path d="M100,60 C80,60 70,80 70,100 C70,130 100,130 100,130 L100,135 C100,135 130,130 130,100 C130,80 120,60 100,60 Z" 
        fill="none" stroke="#FF4D4D" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- Concentric rings -->
  <circle cx="100" cy="100" r="40" fill="url(#ghostGradient)" opacity="0.2"/>
  <circle cx="100" cy="100" r="50" fill="url(#ghostGradient)" opacity="0.1"/>
  <!-- Fading dust -->
  <circle cx="90" cy="90" r="2" fill="#7EC8D3" opacity="0.3"/>
  <circle cx="110" cy="90" r="1.5" fill="#7EC8D3" opacity="0.2"/>
  <circle cx="100" cy="110" r="1" fill="#7EC8D3" opacity="0.15"/>
</svg>