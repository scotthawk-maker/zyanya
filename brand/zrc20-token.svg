<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="zrcBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140D24"/>
      <stop offset="50%" stop-color="#0C0717"/>
      <stop offset="100%" stop-color="#05030A"/>
    </linearGradient>
    <linearGradient id="zrcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#A855F7" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Tactile Soft Square Background -->
  <rect x="10" y="10" width="180" height="180" rx="46" ry="46" fill="url(#zrcBg)" stroke="#A855F7" stroke-width="3" stroke-opacity="0.45"/>
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="13" y="13" width="174" height="174" rx="43" ry="43" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
  
  <!-- Bold Centered ZRC Typography -->
  <text x="100" y="116" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5" fill="url(#zrcGrad)" text-anchor="middle" filter="url(#purpleGlow)">ZRC</text>
  
  <!-- Standard Pill Badge -->
  <rect x="66" y="136" width="68" height="18" rx="9" ry="9" fill="#A855F7" fill-opacity="0.15" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="100" y="149" font-family="'Fira Code', monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#C084FC" text-anchor="middle">TOKEN</text>
</svg>