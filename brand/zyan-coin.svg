<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04070F"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Tactile Soft Square (Squircle) Background -->
  <rect x="10" y="10" width="180" height="180" rx="46" ry="46" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="13" y="13" width="174" height="174" rx="43" ry="43" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
  
  <!-- Bold Centered ZYN Typography -->
  <text x="100" y="122" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-2" fill="url(#textGrad)" text-anchor="middle" filter="url(#cyanGlow)">ZYN</text>
</svg>