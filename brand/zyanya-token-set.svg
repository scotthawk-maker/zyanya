<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0A0F1C"/>
  <!-- ZYAN COIN -->
  <g transform="translate(100,100)">
    <circle r="50" fill="none" stroke="#0D3B50" stroke-width="2"/>
    <path d="M-30,-30 L30,-30 L-30,30 L30,30" fill="none" stroke="#7EC8D3" stroke-width="2"/>
    <text x="0" y="80" font-family="Courier New" font-size="10" fill="#7EC8D3" text-anchor="middle">ZYAN</text>
  </g>
  <!-- GHOST TOKEN -->
  <g transform="translate(300,100)">
    <circle r="45" fill="none" stroke="#7EC8D3" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <path d="M0,-20 C-10,-20 -10,0 -10,0 C-10,10 0,10 0,10 C10,10 10,0 10,0 C10,-20 0,-20 0,-20" fill="none" stroke="#FF4D4D" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="0" y="80" font-family="Courier New" font-size="10" fill="#FF4D4D" text-anchor="middle">GHOST</text>
  </g>
  <!-- TIME-LOCKED TOKEN (padlock with dotted shackle) -->
  <g transform="translate(500,100)">
    <rect x="-20" y="10" width="40" height="30" fill="none" stroke="#7EC8D3" stroke-width="2" rx="5"/>
    <path d="M-15,10 C-15,0 -5,0 -5,0 C-5,0 5,0 5,0 C5,0 15,0 15,0" fill="none" stroke="#7EC8D3" stroke-width="1.5" stroke-dasharray="2,1"/>
    <text x="0" y="80" font-family="Courier New" font-size="10" fill="#7EC8D3" text-anchor="middle">TICKET</text>
  </g>
</svg>