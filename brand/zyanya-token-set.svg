<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240">
  <defs>
    <linearGradient id="setBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#070A14"/>
      <stop offset="100%" stop-color="#03050A"/>
    </linearGradient>
    
    <!-- ZYN gradients & filter -->
    <linearGradient id="zynBgS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="50%" stop-color="#090E1A"/><stop offset="100%" stop-color="#04070F"/>
    </linearGradient>
    <linearGradient id="zynTxtS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#F1F5F9"/><stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="zynGlowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>

    <!-- ZRC gradients & filter -->
    <linearGradient id="zrcBgS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140D24"/><stop offset="50%" stop-color="#0C0717"/><stop offset="100%" stop-color="#05030A"/>
    </linearGradient>
    <linearGradient id="zrcTxtS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#F3E8FF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="zrcGlowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.45"/>
    </filter>

    <!-- LP gradients & filter -->
    <linearGradient id="lpBgS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1328"/><stop offset="50%" stop-color="#080C1B"/><stop offset="100%" stop-color="#04060F"/>
    </linearGradient>
    <linearGradient id="lpTxtS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#EEF2FF"/><stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="lpGlowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>

    <!-- STAKE gradients & filter -->
    <linearGradient id="stkBgS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081A16"/><stop offset="50%" stop-color="#05100E"/><stop offset="100%" stop-color="#020807"/>
    </linearGradient>
    <linearGradient id="stkTxtS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="stkGlowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Frame -->
  <rect width="960" height="240" rx="16" ry="16" fill="url(#setBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- 1. ZYN (Sovereign L1) -->
  <g transform="translate(60, 25)">
    <rect width="140" height="140" rx="36" ry="36" fill="url(#zynBgS)" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.45"/>
    <rect x="2.5" y="2.5" width="135" height="135" rx="33.5" ry="33.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <text x="70" y="87" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5" fill="url(#zynTxtS)" text-anchor="middle" filter="url(#zynGlowS)">ZYN</text>
    <text x="70" y="172" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1" text-anchor="middle">SOVEREIGN</text>
  </g>

  <!-- 2. ZRC (Launchpad Token) -->
  <g transform="translate(290, 25)">
    <rect width="140" height="140" rx="36" ry="36" fill="url(#zrcBgS)" stroke="#A855F7" stroke-width="2.5" stroke-opacity="0.45"/>
    <rect x="2.5" y="2.5" width="135" height="135" rx="33.5" ry="33.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <text x="70" y="84" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="-1" fill="url(#zrcTxtS)" text-anchor="middle" filter="url(#zrcGlowS)">ZRC</text>
    <rect x="42" y="98" width="56" height="16" rx="8" ry="8" fill="#A855F7" fill-opacity="0.15" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="110" font-family="'Fira Code', monospace" font-size="8" font-weight="700" letter-spacing="1" fill="#C084FC" text-anchor="middle">TOKEN</text>
    <text x="70" y="172" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#A855F7" letter-spacing="1" text-anchor="middle">LAUNCHPAD</text>
  </g>

  <!-- 3. LP (AMM Pool) -->
  <g transform="translate(520, 25)">
    <rect width="140" height="140" rx="36" ry="36" fill="url(#lpBgS)" stroke="#6366F1" stroke-width="2.5" stroke-opacity="0.45"/>
    <rect x="2.5" y="2.5" width="135" height="135" rx="33.5" ry="33.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <text x="70" y="85" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="-1.5" fill="url(#lpTxtS)" text-anchor="middle" filter="url(#lpGlowS)">LP</text>
    <rect x="38" y="98" width="64" height="16" rx="8" ry="8" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="110" font-family="'Fira Code', monospace" font-size="8" font-weight="700" letter-spacing="1" fill="#818CF8" text-anchor="middle">AMM POOL</text>
    <text x="70" y="172" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#818CF8" letter-spacing="1" text-anchor="middle">LIQUIDITY</text>
  </g>

  <!-- 4. STAKE (Yield Vault) -->
  <g transform="translate(750, 25)">
    <rect width="140" height="140" rx="36" ry="36" fill="url(#stkBgS)" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.45"/>
    <rect x="2.5" y="2.5" width="135" height="135" rx="33.5" ry="33.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <text x="70" y="85" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="-1.5" fill="url(#stkTxtS)" text-anchor="middle" filter="url(#stkGlowS)">STK</text>
    <rect x="40" y="98" width="60" height="16" rx="8" ry="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="110" font-family="'Fira Code', monospace" font-size="8" font-weight="700" letter-spacing="1" fill="#34D399" text-anchor="middle">VAULT</text>
    <text x="70" y="172" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1" text-anchor="middle">REWARDS</text>
  </g>
</svg>