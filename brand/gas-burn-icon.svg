<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="burnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04070F"/>
    </linearGradient>
    <linearGradient id="plasmaFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="plasmaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Tactile Soft Square Background -->
  <rect x="10" y="10" width="180" height="180" rx="46" ry="46" fill="url(#burnBg)" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="13" y="13" width="174" height="174" rx="43" ry="43" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
  
  <!-- Ethereal Quantum Flame Geometry -->
  <path d="M100 48 C118 78 136 104 136 128 C136 148 120 162 100 162 C80 162 64 148 64 128 C64 108 78 86 100 48 Z" fill="url(#plasmaFlame)" filter="url(#plasmaGlow)"/>
  
  <!-- Inner Flame Core -->
  <path d="M100 96 C110 114 118 126 118 136 C118 146 110 152 100 152 C90 152 82 146 82 136 C82 124 90 112 100 96 Z" fill="#FFFFFF" opacity="0.85"/>

  <!-- Orbital Micro-Sparks -->
  <circle cx="72" cy="78" r="2.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="128" cy="74" r="2" fill="#818CF8" opacity="0.8"/>
  <circle cx="134" cy="106" r="2.5" fill="#38BDF8" opacity="0.7"/>
</svg>