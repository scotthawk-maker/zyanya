<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0A0F1C"/>
  <!-- Burning hex flame -->
  <defs>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0A0F1C"/>
    </linearGradient>
  </defs>
  <path d="M100,150 C110,120 100,80 90,100 C80,120 70,140 80,150 Z" fill="url(#flameGradient)"/>
  <!-- Hex digits at base -->
  <g font-family="Courier New" font-size="12" fill="#FF4D4D" text-anchor="middle">
    <text x="90" y="170">FF</text>
    <text x="100" y="170">FF</text>
    <text x="110" y="170">FF</text>
  </g>
  <!-- Burning ash (gray) -->
  <path d="M95,140 C100,130 105,140 100,150 Z" fill="#333333"/>
  <!-- Shards -->
  <g fill="none" stroke="#FF4D4D" stroke-width="1">
    <line x1="100" y1="150" x2="70" y2="120"/>
    <line x1="100" y1="150" x2="130" y2="120"/>
    <line x1="100" y1="150" x2="60" y2="80"/>
    <line x1="100" y1="150" x2="140" y2="80"/>
  </g>
  <!-- 50% BURN labels -->
  <g font-family="Courier New" font-size="8" fill="#E0E0E0" text-anchor="middle">
    <text x="75" y="135">50%</text>
    <text x="125" y="135">BURN</text>
  </g>
</svg>