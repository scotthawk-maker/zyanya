<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="coinBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04070F"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Tactile Coin Rim -->
  <circle cx="120" cy="120" r="110" fill="url(#coinBg)" stroke="#38BDF8" stroke-width="3.5" stroke-opacity="0.45"/>
  <circle cx="120" cy="120" r="110" fill="url(#rimGlow)"/>

  <!-- Inner Specular Highlight Rim -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>
  
  <!-- Subtle Concentric Precision Track -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,6" stroke-opacity="0.3"/>

  <!-- Sovereign Z Geometric Emblem -->
  <path d="M78 76 H162 L82 164 H166" fill="none" stroke="url(#coinGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#coinGlow)"/>
  
  <!-- Precision Orbital Pips -->
  <circle cx="50" cy="120" r="4" fill="#38BDF8" opacity="0.8"/>
  <circle cx="190" cy="120" r="4" fill="#38BDF8" opacity="0.8"/>
  <circle cx="120" cy="46" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="120" cy="194" r="3" fill="#38BDF8" opacity="0.6"/>
</svg>