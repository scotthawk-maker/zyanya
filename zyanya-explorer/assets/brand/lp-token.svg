<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lpBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1328"/>
      <stop offset="50%" stop-color="#080C1B"/>
      <stop offset="100%" stop-color="#04060F"/>
    </linearGradient>
    <linearGradient id="lpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="indigoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Tactile Soft Square Background -->
  <rect x="10" y="10" width="180" height="180" rx="46" ry="46" fill="url(#lpBg)" stroke="#6366F1" stroke-width="3" stroke-opacity="0.45"/>
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="13" y="13" width="174" height="174" rx="43" ry="43" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
  
  <!-- Bold Centered LP Typography -->
  <text x="100" y="118" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-2" fill="url(#lpGrad)" text-anchor="middle" filter="url(#indigoGlow)">LP</text>
  
  <!-- AMM POOL Pill Badge -->
  <rect x="62" y="138" width="76" height="18" rx="9" ry="9" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
  <text x="100" y="151" font-family="'Fira Code', monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#818CF8" text-anchor="middle">AMM POOL</text>
</svg>