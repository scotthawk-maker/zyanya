<svg width="520" height="120" viewBox="0 0 520 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7EC8D3"/>
      <stop offset="100%" stop-color="#7EC8D3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- thin spectral-blue rule above the wordmark (the "channel") -->
  <line x1="120" y1="32" x2="400" y2="32" stroke="#7EC8D3" stroke-width="1" opacity="0.25"/>
  <!-- ZYANYA wordmark, centered-left so the trailing dots balance to the right -->
  <text x="200" y="72" font-family="'Fira Code', 'Courier New', monospace" font-size="28" font-weight="600" fill="#7EC8D3" text-anchor="middle" letter-spacing="8" filter="url(#glow)">ZYANYA</text>
  <!-- trailing ghost-dots: 4 fading dots trailing off to the right (the ghost dissolving) -->
  <circle cx="300" cy="66" r="5" fill="url(#dotGlow)"/>
  <circle cx="330" cy="64" r="4" fill="url(#dotGlow)" opacity="0.7"/>
  <circle cx="356" cy="60" r="3" fill="url(#dotGlow)" opacity="0.45"/>
  <circle cx="378" cy="54" r="2" fill="url(#dotGlow)" opacity="0.22"/>
</svg>
