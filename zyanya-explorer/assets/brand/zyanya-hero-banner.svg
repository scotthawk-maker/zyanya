<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tunnel" cx="0.5" cy="0.5" r="0.8" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#0D3B50"/>
      <stop offset="100%" stop-color="#0A0F1C"/>
    </radialGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#tunnel)"/>
  <!-- Wireframe hex grid -->
  <g stroke="#7EC8D3" stroke-width="0.3" opacity="0.1">
    <path d="M600,200 L600,150 M570,175 L630,225 M630,175 L570,225"/>
    <path d="M600,200 L600,250 M570,225 L630,175 M630,225 L570,175"/>
    <path d="M600,200 L650,200 M600,150 L650,250 M600,250 L650,150"/>
    <path d="M600,200 L550,200 M600,150 L550,250 M600,250 L550,150"/>
  </g>
  <!-- Ghost made of IPv6 nodes -->
  <g filter="url(#glow2)">
    <circle cx="600" cy="100" r="2" fill="#7EC8D3" opacity="0.8"/>
    <circle cx="620" cy="110" r="1.5" fill="#7EC8D3" opacity="0.6"/>
    <circle cx="580" cy="110" r="1.5" fill="#7EC8D3" opacity="0.6"/>
    <circle cx="610" cy="90" r="1" fill="#7EC8D3" opacity="0.4"/>
    <circle cx="590" cy="90" r="1" fill="#7EC8D3" opacity="0.4"/>
  </g>
  <!-- Text -->
  <text x="600" y="200" font-family="Courier New, monospace" font-size="18" fill="#7EC8D3" text-anchor="middle" letter-spacing="3" filter="url(#glow2)">
    THE GHOST IN THE IPv6 MACHINE
  </text>
  <text x="600" y="240" font-family="Courier New, monospace" font-size="14" fill="#7EC8D3" text-anchor="middle" letter-spacing="6">
    FOREVER. ALWAYS.
  </text>
</svg>